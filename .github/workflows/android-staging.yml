# Copied from https://github.com/MutinyWallet/mutiny-web/blob/master/.github/workflows/android-staging.yml
name: Release Android Staging

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache gradle
        uses: actions/cache@v1
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install app dependencies
        run: pnpm install

      - name: Build app
        run: pnpm build

      - name: Capacitor sync
        run: npx cap sync

      - name: Build AAB
        working-directory: android
        run: ./gradlew clean bundleRelease --stacktrace

      # Temp Removed Sign AAB (F-Droid)

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      # Temp Removed Sign APK (F-Droid)

      # F-Droid APK
      - name: Upload F-Droid APK Universal Asset
        id: upload-release-asset-fdroid-universal-apk
        uses: actions/upload-artifact@v3
        with:
          path: android/app/build/outputs/apk/fdroid/release/app-fdroid-universal-release-unsigned-signed.apk
          name: satellite-earth-fdroid-universal-dev.apk

      - name: Upload F-Droid APK x86 Asset
        id: upload-release-asset-fdroid-x86-apk
        uses: actions/upload-artifact@v3
        with:
          path: android/app/build/outputs/apk/fdroid/release/app-fdroid-x86-release-unsigned-signed.apk
          name: satellite-earth-fdroid-x86-dev.apk

      - name: Upload F-Droid APK x86_64 Asset
        id: upload-release-asset-fdroid-x86-64-apk
        uses: actions/upload-artifact@v3
        with:
          path: android/app/build/outputs/apk/fdroid/release/app-fdroid-x86_64-release-unsigned-signed.apk
          name: satellite-earth-fdroid-x86_64-dev.apk

      - name: Upload Unsigned AAB Asset
        uses: actions/upload-artifact@v3
        with:
          path: android/app/build/outputs/bundle/release/app-release.aab
          name: satellite-earth-fdroid-dev.aab

      # F-Droid AAB
      # - name: Upload F-Droid AAB Asset
      #   uses: actions/upload-artifact@v3
      #   with:
      #     path: android/app/build/outputs/bundle/fdroidRelease/app-fdroid-release.aab
      #     name: satellite-earth-fdroid-dev.aab
